mediaType: MOVIES
rules:
  - "0":
      - firstValue: Seerr.isRequested
        action: EQUALS
        customValue:
          type: boolean
          value: "true"
      - operator: AND
        firstValue: Jellyfin.lastViewedAt
        action: NOT_EXISTS
      - operator: AND
        firstValue: Radarr.tags
        action: NOT_CONTAINS_PARTIAL
        customValue:
          type: text
          value: Perma
  - "1":
      - operator: OR
        firstValue: Seerr.isRequested
        action: EQUALS
        customValue:
          type: boolean
          value: "true"
      - operator: AND
        firstValue: Jellyfin.lastViewedAt
        action: BEFORE
        customValue:
          type: custom_days
          value: "7"
      - operator: AND
        firstValue: Radarr.tags
        action: NOT_CONTAINS_PARTIAL
        customValue:
          type: text
          value: Perma
  - "2":
      - operator: OR
        firstValue: Seerr.isRequested
        action: EQUALS
        customValue:
          type: boolean
          value: "false"
      - operator: AND
        firstValue: Jellyfin.lastViewedAt
        action: NOT_EXISTS
      - operator: AND
        firstValue: Radarr.tags
        action: NOT_CONTAINS_PARTIAL
        customValue:
          type: text
          value: Perma
  - "3":
      - operator: OR
        firstValue: Radarr.imdbRating
        action: SMALLER
        customValue:
          type: number
          value: 5
      - operator: AND
        firstValue: Jellyfin.lastViewedAt
        action: NOT_EXISTS
      - operator: AND
        firstValue: Radarr.tags
        action: NOT_CONTAINS_PARTIAL
        customValue:
          type: text
          value: Perma
  - "4":
      - operator: OR
        firstValue: Radarr.diskspace_remaining_gb
        action: SMALLER
        customValue:
          type: number
          value: 20
      - operator: AND
        firstValue: Jellyfin.lastViewedAt
        action: NOT_EXISTS
      - operator: AND
        firstValue: Radarr.tags
        action: NOT_CONTAINS_PARTIAL
        customValue:
          type: text
          value: Perma
