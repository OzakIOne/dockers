name: ozarr
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    env_file: .env
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      - ${DATA_DIR}/media:/data/media
    ports:
      - "1900:1900/udp"
      - "7359:7359/udp"
      - "8096:8096"
      - "8920:8920"
    networks:
      - traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    env_file: .env
    environment:
      - WEBUI_PORT=6767
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${DATA_DIR}:/data
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      - "6767:6767"
    # network_mode: service:gluetun
    networks:
      - traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  qui:
    image: ghcr.io/autobrr/qui:latest
    container_name: qui
    restart: unless-stopped
    env_file: .env
    ports:
      - "7476:7476"
    volumes:
      - ${CONFIG_DIR}/qui:/config
      - ${DATA_DIR}:/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7476/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    # depends_on:
    #   qbittorrent:
    #     condition: service_healthy

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    env_file: .env
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
    ports:
      - "8989:8989"
    networks:
      - traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    env_file: .env
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DATA_DIR}:/data
    ports:
      - "7878:7878"
    networks:
      - traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    env_file: .env
    # environment:
    #   - BASE_URL=http://homarr.example.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_DIR}/homarr:/appdata
    ports:
      - "7575:7575"
    networks:
      - traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7575/api/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5


  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    user: 1000:1000
    env_file: .env
    environment:
      - LOG_LEVEL=debug
    volumes:
      - ${CONFIG_DIR}/seerr:/app/config
    ports:
      - "5055:5055"
    networks:
      - traefik
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      jellyfin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5055/api/v1/settings/public || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    env_file: .env
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - traefik
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      jellyfin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # https://github.com/ThePhaseless/Byparr/
  # https://github.com/germondai/trawl
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    env_file: .env
    volumes:
      - ${CONFIG_DIR}/flaresolverr:/config
    ports:
      - "8191:8191"
    networks:
      - traefik
    restart: unless-stopped

  wizarr:
    container_name: wizarr
    image: ghcr.io/wizarrrr/wizarr
    ports:
      - 5690:5690
    volumes:
      - ${CONFIG_DIR}/wizarr:/data
    env_file: .env
    networks:
      - traefik
    depends_on:
      qbittorrent:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      jellyfin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5690 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    container_name: profilarr
    ports:
      - "6868:6868"
    volumes:
      - ${CONFIG_DIR}/profilarr:/config
    env_file: .env
    environment:
      # Uncomment ORIGIN if you use a reverse proxy to access your containers.
      #- ORIGIN=https://profilarr.yourdomain.com
      - PARSER_HOST=parser
      - PARSER_PORT=5000
    networks:
      - traefik
    depends_on:
      parser:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
      jellyfin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6868/api || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    user: 1000:1000
    volumes:
      - type: bind
        source: ${CONFIG_DIR}/maintainerr
        target: /opt/data
    env_file: .env
    ports:
      - 6246:6246
    restart: unless-stopped
    healthcheck: # already baked into the image; included here so you can tune it
      test: ["CMD", "/opt/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      - traefik

  # Optional - only needed for CF/QP testing
  parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:latest
    container_name: profilarr-parser
    expose:
      - "5000"

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    ports:
      - "11011:11011"
    volumes:
      - ./config/cleanuparr:/config
      - ${DATA_DIR}:/data
    env_file: .env
    networks:
      - traefik
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11011/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # gluetun:
  #   image: ghcr.io/qdm12/gluetun:latest
  #   container_name: gluetun
  #   # line above must be uncommented to allow external containers to connect.
  #   # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/connect-a-container-to-gluetun.md#external-container-to-gluetun
  #   cap_add:
  #     - NET_ADMIN
  #   devices:
  #     - /dev/net/tun:/dev/net/tun
  #   ports:
  #     - 8888:8888/tcp # HTTP proxy
  #     - 8388:8388/tcp # Shadowsocks
  #     - 8388:8388/udp # Shadowsocks
  #   volumes:
  #     - ./config/gluetun:/gluetun
  #   environment:
  #     # See https://github.com/qdm12/gluetun-wiki/tree/main/setup#setup
  #     - VPN_SERVICE_PROVIDER=ivpn
  #     - VPN_TYPE=openvpn
  #     # OpenVPN:
  #     - OPENVPN_USER=
  #     - OPENVPN_PASSWORD=
  #     # Wireguard:
  #     # - WIREGUARD_PRIVATE_KEY=wOEI9rqqbDwnN8/Bpp22sVz48T71vJ4fYmFWujulwUU=
  #     # - WIREGUARD_ADDRESSES=10.64.222.21/32
  #     # Timezone for accurate log times
  #     - TZ=Europe/Paris
  #     # Server list updater
  #     # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/servers.md#update-the-vpn-servers-list
  #     - UPDATER_PERIOD=
  #   # networks:
  #   #   - traefik

networks:
  traefik:
    name: traefik
    external: true
