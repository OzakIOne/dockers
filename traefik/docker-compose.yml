name: traefik
services:
  traefik:
    image: traefik:v3
    container_name: traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/logs:/var/log/traefik
      - ./config/traefik/traefik.yml:/traefik.yml:ro
      - ./config/hotreload/:/etc/traefik/hotreload
    env_file: .env

  traefik-manager:
    image: ghcr.io/chr0nzz/traefik-manager:latest
    container_name: traefik-manager
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - COOKIE_SECURE=false
      - CONFIG_DIR=/app/config/traefik
    volumes:
      - ./config/traefik/hotreload:/app/config/traefik
      - ./config/tm/config:/app/config
      - ./config/tm/backups:/app/backups
    depends_on:
      - traefik


networks:
  traefik:
    name: traefik
    external: true
